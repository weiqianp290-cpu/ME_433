<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>
  <text x="500" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">HW16 — STM32 Current Control Wiring</text>

  <!-- ===== Power rails ===== -->
  <!-- 3.3V rail -->
  <line x1="60" y1="120" x2="940" y2="120" stroke="#e53935" stroke-width="3"/>
  <text x="64" y="113" font-size="13" font-weight="bold" fill="#e53935">3.3V rail (from STM32 3.3V)</text>
  <!-- 6V rail -->
  <line x1="500" y1="150" x2="940" y2="150" stroke="#fb8c00" stroke-width="3"/>
  <text x="504" y="167" font-size="13" font-weight="bold" fill="#fb8c00">6V rail (from battery +)</text>
  <!-- GND rail -->
  <line x1="60" y1="690" x2="940" y2="690" stroke="#222" stroke-width="3"/>
  <text x="64" y="683" font-size="13" font-weight="bold" fill="#222">GND rail (common ground)</text>

  <!-- ===== STM32 Nucleo ===== -->
  <rect x="70" y="230" width="190" height="300" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="165" y="258" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">STM32 Nucleo</text>
  <text x="165" y="276" font-size="11" text-anchor="middle" fill="#1565c0">C092RC</text>

  <!-- STM32 pins (right side) -->
  <g font-size="12" fill="#0d47a1">
    <circle cx="260" cy="300" r="4" fill="#1565c0"/><text x="250" y="304" text-anchor="end">3.3V</text>
    <circle cx="260" cy="330" r="4" fill="#1565c0"/><text x="250" y="334" text-anchor="end">GND</text>
    <circle cx="260" cy="360" r="4" fill="#1565c0"/><text x="250" y="364" text-anchor="end">PA0 (ADC)</text>
    <circle cx="260" cy="390" r="4" fill="#1565c0"/><text x="250" y="394" text-anchor="end">PA8 (TIM1_CH1)</text>
    <circle cx="260" cy="420" r="4" fill="#1565c0"/><text x="250" y="424" text-anchor="end">PA1 (TIM1_CH2)</text>
    <circle cx="260" cy="450" r="4" fill="#1565c0"/><text x="250" y="454" text-anchor="end">PB9 / D14 (SDA)</text>
    <circle cx="260" cy="480" r="4" fill="#1565c0"/><text x="250" y="484" text-anchor="end">PB8 / D15 (SCL)</text>
  </g>

  <!-- 3.3V from STM32 to rail -->
  <path d="M260,300 L300,300 L300,120" fill="none" stroke="#e53935" stroke-width="2"/>
  <!-- GND from STM32 to rail -->
  <path d="M260,330 L320,330 L320,690" fill="none" stroke="#222" stroke-width="2"/>

  <!-- ===== Potentiometer ===== -->
  <rect x="70" y="560" width="150" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="145" y="585" font-size="14" font-weight="bold" text-anchor="middle" fill="#2e7d32">Potentiometer</text>
  <g font-size="11" fill="#1b5e20">
    <circle cx="90" cy="620" r="4" fill="#2e7d32"/><text x="90" y="640" text-anchor="middle">3.3V</text>
    <circle cx="145" cy="620" r="4" fill="#2e7d32"/><text x="145" y="640" text-anchor="middle">wiper</text>
    <circle cx="200" cy="620" r="4" fill="#2e7d32"/><text x="200" y="640" text-anchor="middle">GND</text>
  </g>
  <!-- pot outer1 -> 3.3V -->
  <path d="M90,620 L90,120" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <!-- pot wiper -> PA0 -->
  <path d="M145,620 L145,540 L40,540 L40,360 L260,360" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
  <text x="48" y="535" font-size="10" fill="#6a1b9a">wiper → PA0</text>
  <!-- pot outer2 -> GND -->
  <path d="M200,620 L200,690" fill="none" stroke="#222" stroke-width="1.5"/>

  <!-- ===== DRV8833 ===== -->
  <rect x="420" y="250" width="200" height="320" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="520" y="278" font-size="16" font-weight="bold" text-anchor="middle" fill="#ef6c00">DRV8833</text>
  <text x="520" y="295" font-size="10" text-anchor="middle" fill="#ef6c00">(dual H-bridge in parallel)</text>

  <!-- DRV inputs (left) -->
  <g font-size="11" fill="#e65100">
    <circle cx="420" cy="330" r="4" fill="#ef6c00"/><text x="432" y="334">IN1</text>
    <circle cx="420" cy="360" r="4" fill="#ef6c00"/><text x="432" y="364">IN2</text>
    <circle cx="420" cy="390" r="4" fill="#ef6c00"/><text x="432" y="394">IN3 (=IN1)</text>
    <circle cx="420" cy="420" r="4" fill="#ef6c00"/><text x="432" y="424">IN4 (=IN2)</text>
    <circle cx="420" cy="470" r="4" fill="#ef6c00"/><text x="432" y="474">VCC</text>
    <circle cx="420" cy="500" r="4" fill="#ef6c00"/><text x="432" y="504">GND</text>
    <circle cx="420" cy="530" r="4" fill="#ef6c00"/><text x="432" y="534">EEP (sleep)</text>
  </g>
  <!-- DRV outputs (right) -->
  <g font-size="11" fill="#e65100" text-anchor="end">
    <circle cx="620" cy="340" r="4" fill="#ef6c00"/><text x="608" y="344">OUT1 (=OUT3)</text>
    <circle cx="620" cy="400" r="4" fill="#ef6c00"/><text x="608" y="404">OUT4 (=OUT2)</text>
  </g>

  <!-- PA8 -> IN1 -->
  <path d="M260,390 L360,390 L360,330 L420,330" fill="none" stroke="#1565c0" stroke-width="1.8"/>
  <text x="300" y="384" font-size="10" fill="#1565c0">PA8 → IN1</text>
  <!-- PA1 -> IN2 -->
  <path d="M260,420 L380,420 L380,360 L420,360" fill="none" stroke="#1565c0" stroke-width="1.8"/>
  <text x="300" y="414" font-size="10" fill="#1565c0">PA1 → IN2</text>
  <!-- IN1-IN3 jumper -->
  <path d="M408,330 L400,330 L400,390 L420,390" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3"/>
  <!-- IN2-IN4 jumper -->
  <path d="M410,360 L412,360 L412,420 L420,420" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- VCC -> 6V -->
  <path d="M408,470 L470,470 L470,150" fill="none" stroke="#fb8c00" stroke-width="2"/>
  <!-- GND -> rail -->
  <path d="M408,500 L490,500 L490,690" fill="none" stroke="#222" stroke-width="1.8"/>
  <!-- EEP -> 3.3V -->
  <path d="M408,530 L360,530 L360,120" fill="none" stroke="#e53935" stroke-width="1.8"/>
  <text x="362" y="545" font-size="10" fill="#e53935">EEP → 3.3V</text>

  <!-- ===== Motor ===== -->
  <circle cx="730" cy="340" r="34" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="730" y="345" font-size="15" font-weight="bold" text-anchor="middle" fill="#5e35b1">M</text>
  <text x="730" y="392" font-size="12" text-anchor="middle" fill="#5e35b1">DC motor</text>

  <!-- OUT1 -> motor lead A -->
  <path d="M620,340 L696,340" fill="none" stroke="#5e35b1" stroke-width="2"/>
  <text x="630" y="333" font-size="10" fill="#5e35b1">OUT1 → motor</text>

  <!-- ===== INA219 ===== -->
  <rect x="760" y="430" width="180" height="180" rx="8" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
  <text x="850" y="458" font-size="15" font-weight="bold" text-anchor="middle" fill="#00838f">INA219</text>
  <text x="850" y="474" font-size="10" text-anchor="middle" fill="#00838f">current sensor</text>
  <g font-size="11" fill="#006064">
    <circle cx="760" cy="500" r="4" fill="#00838f"/><text x="772" y="504">VIN+</text>
    <circle cx="760" cy="530" r="4" fill="#00838f"/><text x="772" y="534">VIN−</text>
    <circle cx="760" cy="560" r="4" fill="#00838f"/><text x="772" y="564">SDA</text>
    <circle cx="760" cy="585" r="4" fill="#00838f"/><text x="772" y="589">SCL</text>
    <circle cx="930" cy="500" r="4" fill="#00838f"/><text x="918" y="504" text-anchor="end">VCC</text>
    <circle cx="930" cy="530" r="4" fill="#00838f"/><text x="918" y="534" text-anchor="end">GND</text>
  </g>

  <!-- motor lead B -> VIN+ -->
  <path d="M730,374 L730,500 L760,500" fill="none" stroke="#5e35b1" stroke-width="2"/>
  <text x="735" y="470" font-size="10" fill="#5e35b1">motor → VIN+</text>
  <!-- VIN- -> OUT4 -->
  <path d="M760,530 L660,530 L660,400 L620,400" fill="none" stroke="#00838f" stroke-width="2"/>
  <text x="628" y="420" font-size="10" fill="#00838f">VIN− → OUT4</text>

  <!-- INA VCC -> 3.3V -->
  <path d="M930,500 L960,500 L960,120 L300,120" fill="none" stroke="#e53935" stroke-width="1.5"/>
  <!-- INA GND -> rail -->
  <path d="M930,530 L975,530 L975,690" fill="none" stroke="#222" stroke-width="1.5"/>
  <!-- SDA -> PB9 -->
  <path d="M760,560 L700,560 L700,640 L40,640 L40,450 L260,450" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <text x="710" y="555" font-size="10" fill="#1565c0">SDA → PB9</text>
  <!-- SCL -> PB8 -->
  <path d="M760,585 L690,585 L690,655 L30,655 L30,480 L260,480" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <text x="700" y="600" font-size="10" fill="#1565c0">SCL → PB8</text>

  <!-- ===== Battery ===== -->
  <rect x="640" y="170" width="150" height="60" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="715" y="195" font-size="13" font-weight="bold" text-anchor="middle" fill="#f57f17">Battery 4×AA</text>
  <text x="715" y="213" font-size="11" text-anchor="middle" fill="#f57f17">6V</text>
  <!-- battery + -> 6V rail -->
  <path d="M660,170 L660,150" fill="none" stroke="#fb8c00" stroke-width="2"/>
  <text x="610" y="165" font-size="10" fill="#fb8c00">+ → 6V</text>
  <!-- battery - -> GND -->
  <path d="M770,230 L770,260 L1000,260" fill="none" stroke="#222" stroke-width="0"/>
  <path d="M770,230 L800,230 L800,690" fill="none" stroke="#222" stroke-width="2"/>
  <text x="775" y="248" font-size="10" fill="#222">− → GND</text>

  <!-- ===== Legend ===== -->
  <g font-size="11">
    <rect x="70" y="60" width="14" height="3" fill="#e53935"/><text x="90" y="65" fill="#333">3.3V</text>
    <rect x="150" y="60" width="14" height="3" fill="#fb8c00"/><text x="170" y="65" fill="#333">6V</text>
    <rect x="210" y="60" width="14" height="3" fill="#222"/><text x="230" y="65" fill="#333">GND</text>
    <rect x="280" y="60" width="14" height="3" fill="#1565c0"/><text x="300" y="65" fill="#333">signal (PWM / I2C)</text>
    <rect x="430" y="60" width="14" height="3" fill="#5e35b1"/><text x="450" y="65" fill="#333">motor current path</text>
  </g>

  <text x="500" y="710" font-size="11" text-anchor="middle" fill="#666">Current loop: DRV8833 OUT1 → motor → INA219 VIN+ , INA219 VIN− → DRV8833 OUT4</text>
</svg>
